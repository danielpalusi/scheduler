name: Send Google Chat Checkout Reminder

on:
  schedule:
    # Minute: 30, Hour: 10 UTC (10:30 UTC = 17:30 WIB / UTC+7)
    - cron: '30 10 * * 1-5'

  # Allows manual triggering anytime from the Actions tab
  workflow_dispatch: 

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Reminder Script
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
        run: node send_reminder.js
